name: 🕐 Ежедневные тесты StriveApp

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout кода
        uses: actions/checkout@v4

      - name: ⚙️ Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Установка зависимостей
        run: npm ci

      - name: 🎭 Установка браузеров Playwright
        run: npx playwright install chromium

      - name: 🚀 Запуск всех тестов
        id: tests
        continue-on-error: true
        run: npm run test:all
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          USER_EMAIL_PASSWORD: ${{ secrets.USER_EMAIL_PASSWORD }}
          USER_PHONE: ${{ secrets.USER_PHONE }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          TEST_MESSAGES_CLEANUP_URL: ${{ secrets.TEST_MESSAGES_CLEANUP_URL }}
          TEST_AUTOMATION_SECRET: ${{ secrets.TEST_AUTOMATION_SECRET }}

      - name: 📸 Сохранение артефактов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-log-*.txt
            final-report-*.txt
          retention-days: 30

      - name: ❌ Завершить job с ошибкой, если тесты упали
        if: steps.tests.outcome == 'failure'
        run: exit 1
